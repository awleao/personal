<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avelar Leão - Portfólio</title>
  <!-- Fonte sans-serif arredondada (Fredoka) similar à do layout -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #2b67a4; /* Azul do fundo principal */
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Cabeçalho superior com título e imagem de perfil */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 40px 20px 40px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #2b67a4;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      background-color: #ccc;
      flex-shrink: 0;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Barra de Navegação */
    .nav-bar {
      background-color: #72b3f2; /* Tom azul mais claro da barra */
      padding: 12px 40px;
      display: flex;
      gap: 15px;
    }

    .nav-item {
      text-decoration: none;
      padding: 10px 32px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #ffffff;
      background-color: #4b92db; /* Cor dos botões inativos */
      transition: all 0.2s ease;
      display: inline-block;
      text-align: center;
    }

    /* Botão ativo (Sobre) */
    .nav-item.active {
      background-color: #ffffff;
      color: #4b92db;
      font-weight: 600;
    }

    /* Área de Conteúdo / Cards */
    .content-container {
      display: flex;
      gap: 20px;
      padding: 25px 40px;
      overflow-x: auto;
    }

    .card {
      background-color: #1e4a78; /* Tom azul bem escuro dos cards */
      border-radius: 24px;
      padding: 25px;
      min-height: 400px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    .card-main {
      flex: 1 1 70%;
      min-width: 300px;
    }

    .card-secondary {
      flex: 0 0 300px;
    }

    .card h2 {
      font-size: 2rem;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho com Nome e Perfil -->
  <header class="header">
    <h1>Avelar Leão</h1>
    <div class="profile-avatar">
      <!-- Substitua o src pela URL ou caminho da sua foto -->
      <img src="https://via.placeholder.com/150" alt="Foto de Perfil de Avelar Leão">
    </div>
  </header>

  <!-- Barra de Navegação estilo Pílula -->
  <nav class="nav-bar">
    <a href="#sobre" class="nav-item active">Sobre</a>
    <a href="#projetos" class="nav-item">Projetos</a>
    <a href="#contatos" class="nav-item">Contatos</a>
  </nav>

  <!-- Área Principal de Cards -->
  <main class="content-container">
    <section class="card card-main">
      <h2>Sobre</h2>
      <!-- Adicione seu conteúdo do "Sobre" aqui -->
    </section>

    <section class="card card-secondary">
      <h2>Projetos</h2>
      <!-- Conteúdo do card secundário/visível na lateral -->
    </section>
  </main>

</body>
</html>
